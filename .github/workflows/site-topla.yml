{"name": "Siteyi topla", "on": {"workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"topla": {"runs-on": "ubuntu-latest", "steps": [{"name": "Bu repoyu al", "uses": "actions/checkout@v4"}, {"name": "Dosyaları üç repodan kopyala", "run": "set -euo pipefail\nmkdir -p /tmp/kaynak\nfor r in mindgap civciv-ingilizce karpuz-oyunu; do\n  git clone --depth 1 \"https://github.com/nuhkozan/$r.git\" \"/tmp/kaynak/$r\"\ndone\n\n# Mind Gap: oyunun kendisi + sayfalar\nmkdir -p mindgap/icons\nfor f in index.html manifest.json service-worker.js privacy.html delete-data.html stats.html; do\n  cp \"/tmp/kaynak/mindgap/$f\" \"mindgap/$f\"\ndone\ncp /tmp/kaynak/mindgap/icons/* mindgap/icons/\n\n# Çıvıv İngilizce: docs klasörünün içeriği\nmkdir -p civciv-ingilizce\ncp /tmp/kaynak/civciv-ingilizce/docs/* civciv-ingilizce/\n\n# Karpuz: gizlilik sayfası\nmkdir -p karpuz-oyunu\ncp /tmp/kaynak/karpuz-oyunu/privacy.html karpuz-oyunu/privacy.html\n\n# Neyim Var yönetim paneli\nmkdir -p neyimvar\ncat > neyimvar/panel.html <<'PANEL_SONU'\n<!doctype html>\n<html lang=\"tr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>Neyim Var — Yönetim</title>\n<style>\n:root{--bg:#070b14;--card:#0b1322;--line:#16314a;--cy:#6fe3ff;--yl:#ffd166;--tx:#dbe7f3;--mu:#8fa3b8;--g1:#4fc3ff;--g2:#6bffb8;--bad:#ff6b6b}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nbody{padding:18px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right));max-width:760px;margin:0 auto}\nh1{font-size:clamp(22px,6vw,30px);margin:6px 0 4px;color:var(--cy);text-shadow:0 0 18px rgba(111,227,255,.35)}\nh2{font-size:19px;color:var(--cy);margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n.sub{color:var(--mu);font-size:14px;line-height:1.4;margin:0 0 16px}\n.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}\nbutton{font:inherit;border:1px solid var(--line);background:#0e1b30;color:var(--tx);padding:9px 14px;border-radius:12px}\nbutton.pri{background:linear-gradient(135deg,var(--g1),var(--g2));color:#04121c;font-weight:700;border:0}\nbutton:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}\n.upd{color:var(--mu);font-size:12px}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:104px;min-width:0}\n.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}\n.kpi .n{font-size:clamp(30px,9vw,42px);font-weight:700;color:var(--yl);margin-top:4px;font-variant-numeric:tabular-nums}\n.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}\n.rows{display:flex;flex-direction:column;gap:8px}\n.r{display:grid;grid-template-columns:minmax(3.2rem,7rem) 1fr 3.4rem;gap:10px;align-items:center;font-size:14px}\n.r .t{height:16px;background:#0f1726;border-radius:8px;overflow:hidden}\n.r .f{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--g1),var(--g2));min-width:2px}\n.r .v{text-align:right;font-variant-numeric:tabular-nums}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{text-align:right;padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}\nth:first-child,td:first-child{text-align:left}\nth{color:var(--mu);font-weight:600}\n#today th:nth-child(2),#today td:nth-child(2){text-align:left}\n.note{color:var(--mu);font-size:12.5px;line-height:1.5;margin-top:12px}\n.empty{color:var(--mu);font-size:14px;padding:6px 0}\n#login{max-width:380px;margin:12vh auto 0}\n#login label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}\n#login input{width:100%;font:inherit;background:#0e1b30;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px}\n#login button{width:100%;margin-top:18px;padding:13px}\n.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}\n[hidden]{display:none!important}\n</style>\n</head>\n<body>\n\n<section id=\"login\" hidden>\n  <h1>📊 Neyim Var</h1>\n  <p class=\"sub\">Yönetim paneli. Yalnızca yönetici hesabı girebilir.</p>\n  <form id=\"f\" autocomplete=\"on\">\n    <label for=\"em\">E-posta</label>\n    <input id=\"em\" name=\"username\" type=\"email\" autocomplete=\"username\" required>\n    <label for=\"pw\">Şifre</label>\n    <input id=\"pw\" name=\"password\" type=\"password\" autocomplete=\"current-password\" required>\n    <button class=\"pri\" id=\"go\" type=\"submit\">Giriş yap</button>\n    <div class=\"err\" id=\"err\" role=\"alert\"></div>\n  </form>\n</section>\n\n<main id=\"app\" hidden>\n  <h1>📊 NEYİM VAR — Yönetim</h1>\n  <p class=\"sub\">Uygulama sunucusundaki canlı kayıtlardan hesaplanır. Maliyetler tahmindir.</p>\n  <div class=\"bar\">\n    <button class=\"pri\" id=\"refresh\">Yenile</button>\n    <button id=\"logout\">Çıkış</button>\n    <span class=\"upd\" id=\"upd\"></span>\n  </div>\n\n  <div class=\"grid\">\n    <div class=\"kpi\"><div class=\"l\">Toplam üye</div><div class=\"n\" id=\"k-users\">—</div><div class=\"s\">tüm zamanlar</div></div>\n    <div class=\"kpi\"><div class=\"l\">Yeni üye, 7 gün</div><div class=\"n\" id=\"k-new\">—</div><div class=\"s\" id=\"k-new-s\"></div></div>\n    <div class=\"kpi\"><div class=\"l\">Sorgu, 7 gün</div><div class=\"n\" id=\"k-q\">—</div><div class=\"s\" id=\"k-q-s\"></div></div>\n    <div class=\"kpi\"><div class=\"l\">Maliyet, 7 gün</div><div class=\"n\" id=\"k-c\">—</div><div class=\"s\" id=\"k-c-s\"></div></div>\n    <div class=\"kpi\"><div class=\"l\">Sorgu başı maliyet</div><div class=\"n\" id=\"k-cpq\">—</div><div class=\"s\">başarılı sorgu ortalaması</div></div>\n    <div class=\"kpi\"><div class=\"l\">Bekleyen ödeme</div><div class=\"n\" id=\"k-pay\">—</div><div class=\"s\" id=\"k-pay-s\"></div></div>\n  </div>\n\n  <h2>🟢 Bugün sorgu yapan üyeler</h2>\n  <div id=\"today\"></div>\n\n  <h2>Günlük sorgu (son 14 gün)</h2>\n  <div class=\"rows\" id=\"d-q\"></div>\n\n  <h2>Günlük yeni üye (son 14 gün)</h2>\n  <div class=\"rows\" id=\"d-u\"></div>\n\n  <h2>Uygulama sürümü</h2>\n  <div class=\"rows\" id=\"ver\"></div>\n  <p class=\"note\">Son 14 günde sorgu yapan kullanıcıların sürüm payı. 3.0 yayınlanınca burada görünür.</p>\n\n  <h2>Sorgu türüne göre maliyet</h2>\n  <div id=\"kinds\"></div>\n\n  <h2>Üyelerin ülkesi</h2>\n  <div class=\"rows\" id=\"cty\"></div>\n\n  <p class=\"note\" id=\"foot\"></p>\n</main>\n\n<script>\n(function(){\n  var API = \"https://neyim-var-phi.vercel.app/api\";\n  var KEY = \"nv_panel_token\";\n  var $ = function(id){ return document.getElementById(id); };\n  var nf = new Intl.NumberFormat(\"tr-TR\");\n  var token = null, timer = null;\n\n  function store(v){ try{ if(v) localStorage.setItem(KEY,v); else localStorage.removeItem(KEY); }catch(e){} }\n  function load(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }\n\n  function show(which){ $(\"login\").hidden = which !== \"login\"; $(\"app\").hidden = which !== \"app\"; }\n  function usd(v,d){ return \"$\" + Number(v||0).toFixed(d); }\n  function put(id,t){ $(id).textContent = t; }\n\n  async function post(path, body){\n    var r = await fetch(API + path, { method:\"POST\", headers:{\"Content-Type\":\"application/json\"}, body: JSON.stringify(body) });\n    var j = null; try{ j = await r.json(); }catch(e){}\n    return { status: r.status, data: j || {} };\n  }\n\n  function bars(el, rows, label, value, fmt){\n    el.replaceChildren();\n    if(!rows.length){ var e = document.createElement(\"div\"); e.className=\"empty\"; e.textContent=\"Henüz veri yok\"; el.appendChild(e); return; }\n    var mx = Math.max.apply(null, rows.map(function(r){ return Number(value(r))||0; })) || 1;\n    rows.forEach(function(r){\n      var row = document.createElement(\"div\"); row.className = \"r\";\n      var l = document.createElement(\"span\"); l.textContent = label(r);\n      var t = document.createElement(\"div\"); t.className = \"t\";\n      var f = document.createElement(\"div\"); f.className = \"f\"; f.style.width = (100*(Number(value(r))||0)/mx) + \"%\";\n      t.appendChild(f);\n      var v = document.createElement(\"span\"); v.className = \"v\"; v.textContent = fmt ? fmt(r) : nf.format(Number(value(r))||0);\n      row.appendChild(l); row.appendChild(t); row.appendChild(v); el.appendChild(row);\n    });\n  }\n\n  function table(el, head, rows){\n    el.replaceChildren();\n    if(!rows.length){ var e = document.createElement(\"div\"); e.className=\"empty\"; e.textContent=\"Henüz veri yok\"; el.appendChild(e); return; }\n    var tb = document.createElement(\"table\"), th = document.createElement(\"thead\"), tr = document.createElement(\"tr\");\n    head.forEach(function(h){ var c = document.createElement(\"th\"); c.textContent = h; tr.appendChild(c); });\n    th.appendChild(tr); tb.appendChild(th);\n    var body = document.createElement(\"tbody\");\n    rows.forEach(function(r){ var x = document.createElement(\"tr\"); r.forEach(function(v){ var c = document.createElement(\"td\"); c.textContent = v; x.appendChild(c); }); body.appendChild(x); });\n    tb.appendChild(body); el.appendChild(tb);\n  }\n\n  function dayLabel(d){ var p = d.split(\"-\"); return Number(p[2]) + \".\" + Number(p[1]); }\n  function hhmm(iso){ var d = new Date(iso); return isNaN(d) ? \"\" : d.toLocaleTimeString(\"tr-TR\",{hour:\"2-digit\",minute:\"2-digit\"}); }\n\n  function render(d){\n    var t = d.totals;\n    put(\"k-users\", nf.format(t.users));\n    put(\"k-new\", nf.format(t.newUsers7d)); put(\"k-new-s\",\"önceki 7 gün: \" + nf.format(t.newUsersPrev7d));\n    put(\"k-q\", nf.format(t.queries7d)); put(\"k-q-s\",\"önceki 7 gün: \" + nf.format(t.queriesPrev7d));\n    put(\"k-c\", usd(t.cost7d,2)); put(\"k-c-s\",\"toplam: \" + usd(t.costTotal,2));\n    put(\"k-cpq\", usd(t.costPerQuery,3));\n    put(\"k-pay\", nf.format(t.pendingPayments)); put(\"k-pay-s\",\"kredisi biten üye: \" + nf.format(t.zeroCreditUsers));\n\n    var tdy = d.today || [];\n    table($(\"today\"), [\"#\",\"Üye\",\"Son saat\",\"Sorgu\"], tdy.map(function(r,i){ return [String(i+1), r.name, hhmm(r.last), nf.format(r.queries)]; }));\n\n    bars($(\"d-q\"), d.daily, function(r){ return dayLabel(r.day); }, function(r){ return r.queries; });\n    bars($(\"d-u\"), d.daily, function(r){ return dayLabel(r.day); }, function(r){ return r.signups; });\n    bars($(\"ver\"), d.versions, function(r){ return r.version; }, function(r){ return r.users; }, function(r){ return nf.format(r.users) + \" · %\" + String(r.pct).replace(\".\",\",\"); });\n    table($(\"kinds\"), [\"Tür\",\"Sorgu\",\"Maliyet\",\"Sorgu başı\"], d.kinds.map(function(r){ return [r.kind, nf.format(r.queries), usd(r.cost,2), usd(r.queries ? r.cost/r.queries : 0, 3)]; }));\n    bars($(\"cty\"), d.countries, function(r){ return r.country; }, function(r){ return r.users; });\n\n    put(\"upd\",\"Güncellendi: \" + new Date(d.generatedAt).toLocaleTimeString(\"tr-TR\",{hour:\"2-digit\",minute:\"2-digit\"}));\n    put(\"foot\",\"Maliyet: \" + (d.costNote || \"tahmin\") + \". Gerçek harcama için Anthropic konsoluna, reklam geliri için AdMob'a bakın. Günler UTC'ye göre sayılır.\");\n  }\n\n  function logout(msg){\n    token = null; store(null); if(timer){ clearInterval(timer); timer = null; }\n    put(\"err\", msg || \"\"); show(\"login\");\n  }\n\n  async function fetchOverview(){\n    var btn = $(\"refresh\"); btn.disabled = true; btn.textContent = \"Yükleniyor…\";\n    try{\n      var r = await post(\"/admin?action=overview\", { token: token });\n      if(r.status === 401){ logout(\"Oturum süresi doldu, tekrar giriş yap.\"); return; }\n      if(r.status !== 200){ put(\"upd\",\"Veri alınamadı (\" + r.status + \")\"); return; }\n      render(r.data);\n    }catch(e){\n      put(\"upd\",\"Sunucuya ulaşılamadı. Bağlantını kontrol et.\");\n    }finally{\n      btn.disabled = false; btn.textContent = \"Yenile\";\n    }\n  }\n\n  function start(){\n    show(\"app\"); fetchOverview();\n    if(timer) clearInterval(timer);\n    timer = setInterval(function(){ if(!document.hidden) fetchOverview(); }, 60000);\n  }\n\n  $(\"f\").addEventListener(\"submit\", async function(ev){\n    ev.preventDefault();\n    put(\"err\",\"\"); var b = $(\"go\"); b.disabled = true; b.textContent = \"Giriş yapılıyor…\";\n    try{\n      var r = await post(\"/auth?action=login\", { email: $(\"em\").value.trim(), password: $(\"pw\").value });\n      if(r.status === 200 && r.data.token){\n        token = r.data.token; store(token); $(\"pw\").value = \"\"; start();\n      }else if(r.status === 404 || r.status === 401){\n        put(\"err\",\"E-posta veya şifre hatalı.\");\n      }else if(r.status === 403){\n        put(\"err\",\"Bu hesap yönetici değil.\");\n      }else{\n        put(\"err\",\"Giriş yapılamadı (\" + r.status + \").\");\n      }\n    }catch(e){\n      put(\"err\",\"Sunucuya ulaşılamadı. Bağlantını kontrol et.\");\n    }finally{\n      b.disabled = false; b.textContent = \"Giriş yap\";\n    }\n  });\n  $(\"refresh\").addEventListener(\"click\", fetchOverview);\n  $(\"logout\").addEventListener(\"click\", function(){ logout(\"\"); });\n\n  token = load();\n  if(token){ start(); } else { show(\"login\"); }\n})();\n</script>\n</body>\n</html>\nPANEL_SONU\n\nfind mindgap civciv-ingilizce karpuz-oyunu neyimvar -type f | sort\n"}, {"name": "Kaydet", "run": "git config user.name \"site-topla\"\ngit config user.email \"site-topla@users.noreply.github.com\"\ngit add -A\nif git diff --cached --quiet; then\n  echo \"Değişiklik yok\"\nelse\n  git commit -m \"Üç projenin site dosyalarını topla\"\n  git push\nfi\n"}]}}}
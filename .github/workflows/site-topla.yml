name: Siteyi topla on: workflow_dispatch: permissions: contents: write jobs: topla: runs-on: ubuntu-latest steps: - name: Bu repoyu al uses: actions/checkout@v4 - name: Dosyaları üç repodan kopyala run: | set -euo pipefail mkdir -p /tmp/kaynak for r in mindgap civciv-ingilizce karpuz-oyunu; do git clone --depth 1 "https://github.com/nuhkozan/$r.git" "/tmp/kaynak/$r" done # Mind Gap: oyunun kendisi + sayfalar mkdir -p mindgap/icons for f in index.html manifest.json service-worker.js privacy.html delete-data.html stats.html; do cp "/tmp/kaynak/mindgap/$f" "mindgap/$f" done cp /tmp/kaynak/mindgap/icons/* mindgap/icons/ # Çıvıv İngilizce: docs klasörünün içeriği mkdir -p civciv-ingilizce cp /tmp/kaynak/civciv-ingilizce/docs/* civciv-ingilizce/ # Karpuz: gizlilik sayfası mkdir -p karpuz-oyunu cp /tmp/kaynak/karpuz-oyunu/privacy.html karpuz-oyunu/privacy.html # Neyim Var yönetim paneli mkdir -p neyimvar cat > neyimvar/panel.html <<'PANEL_SONU' <!doctype html> <html lang="tr"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"> <meta name="robots" content="noindex,nofollow"> <title>Neyim Var — Yönetim</title> <style> :root{--bg:#070b14;--card:#0b1322;--line:#16314a;--cy:#6fe3ff;--yl:#ffd166;--tx:#dbe7f3;--mu:#8fa3b8;--g1:#4fc3ff;--g2:#6bffb8;--bad:#ff6b6b} *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif} body{padding:18px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right));max-width:760px;margin:0 auto} h1{font-size:clamp(22px,6vw,30px);margin:6px 0 4px;color:var(--cy);text-shadow:0 0 18px rgba(111,227,255,.35)} h2{font-size:19px;color:var(--cy);margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)} .sub{color:var(--mu);font-size:14px;line-height:1.4;margin:0 0 16px} .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px} button{font:inherit;border:1px solid var(--line);background:#0e1b30;color:var(--tx);padding:9px 14px;border-radius:12px} button.pri{background:linear-gradient(135deg,var(--g1),var(--g2));color:#04121c;font-weight:700;border:0} button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px} .upd{color:var(--mu);font-size:12px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .kpi{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:104px;min-width:0} .kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)} .kpi .n{font-size:clamp(30px,9vw,42px);font-weight:700;color:var(--yl);margin-top:4px;font-variant-numeric:tabular-nums} .kpi .s{font-size:12px;color:var(--mu);margin-top:2px} .rows{display:flex;flex-direction:column;gap:8px} .r{display:grid;grid-template-columns:minmax(3.2rem,7rem) 1fr 3.4rem;gap:10px;align-items:center;font-size:14px} .r .t{height:16px;background:#0f1726;border-radius:8px;overflow:hidden} .r .f{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--g1),var(--g2));min-width:2px} .r .v{text-align:right;font-variant-numeric:tabular-nums} table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:right;padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums} th:first-child,td:first-child{text-align:left} th{color:var(--mu);font-weight:600} #today th:nth-child(2),#today td:nth-child(2){text-align:left} .note{color:var(--mu);font-size:12.5px;line-height:1.5;margin-top:12px} .empty{color:var(--mu);font-size:14px;padding:6px 0} #login{max-width:380px;margin:12vh auto 0} #login label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px} #login input{width:100%;font:inherit;background:#0e1b30;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px} #login button{width:100%;margin-top:18px;padding:13px} .err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px} [hidden]{display:none!important} </style> </head> <body> <section id="login" hidden> <h1>📊 Neyim Var</h1> <p class="sub">Yönetim paneli. Yalnızca yönetici hesabı girebilir.</p> <form id="f" autocomplete="on"> <label for="em">E-posta</label> <input id="em" name="username" type="email" autocomplete="username" required> <label for="pw">Şifre</label> <input id="pw" name="password" type="password" autocomplete="current-password" required> <button class="pri" id="go" type="submit">Giriş yap</button> <div class="err" id="err" role="alert"></div> </form> </section> <main id="app" hidden> <h1>📊 NEYİM VAR — Yönetim</h1> <p class="sub">Uygulama sunucusundaki canlı kayıtlardan hesaplanır. Maliyetler tahmindir.</p> <div class="bar"> <button class="pri" id="refresh">Yenile</button> <button id="logout">Çıkış</button> <span class="upd" id="upd"></span> </div> <div class="grid"> <div class="kpi"><div class="l">Toplam üye</div><div class="n" id="k-users">—</div><div class="s">tüm zamanlar</div></div> <div class="kpi"><div class="l">Yeni üye, 7 gün</div><div class="n" id="k-new">—</div><div class="s" id="k-new-s"></div></div> <div class="kpi"><div class="l">Sorgu, 7 gün</div><div class="n" id="k-q">—</div><div class="s" id="k-q-s"></div></div> <div class="kpi"><div class="l">Maliyet, 7 gün</div><div class="n" id="k-c">—</div><div class="s" id="k-c-s"></div></div> <div class="kpi"><div class="l">Sorgu başı maliyet</div><div class="n" id="k-cpq">—</div><div class="s">başarılı sorgu ortalaması</div></div> <div class="kpi"><div class="l">Bekleyen ödeme</div><div class="n" id="k-pay">—</div><div class="s" id="k-pay-s"></div></div> </div> <h2>🟢 Bugün sorgu yapan üyeler</h2> <div id="today"></div> <h2>Günlük sorgu (son 14 gün)</h2> <div class="rows" id="d-q"></div> <h2>Günlük yeni üye (son 14 gün)</h2> <div class="rows" id="d-u"></div> <h2>Uygulama sürümü</h2> <div class="rows" id="ver"></div> <p class="note">Son 14 günde sorgu yapan kullanıcıların sürüm payı. 3.0 yayınlanınca burada görünür.</p> <h2>Sorgu türüne göre maliyet</h2> <div id="kinds"></div> <h2>Üyelerin ülkesi</h2> <div class="rows" id="cty"></div> <p class="note" id="foot"></p> </main> <script> (function(){ var API = "https://neyim-var-phi.vercel.app/api"; var KEY = "nv_panel_token"; var $ = function(id){ return document.getElementById(id); }; var nf = new Intl.NumberFormat("tr-TR"); var token = null, timer = null; function store(v){ try{ if(v) localStorage.setItem(KEY,v); else localStorage.removeItem(KEY); }catch(e){} } function load(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } } function show(which){ $("login").hidden = which !== "login"; $("app").hidden = which !== "app"; } function usd(v,d){ return "$" + Number(v||0).toFixed(d); } function put(id,t){ $(id).textContent = t; } async function post(path, body){ var r = await fetch(API + path, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }); var j = null; try{ j = await r.json(); }catch(e){} return { status: r.status, data: j || {} }; } function bars(el, rows, label, value, fmt){ el.replaceChildren(); if(!rows.length){ var e = document.createElement("div"); e.className="empty"; e.textContent="Henüz veri yok"; el.appendChild(e); return; } var mx = Math.max.apply(null, rows.map(function(r){ return Number(value(r))||0; })) || 1; rows.forEach(function(r){ var row = document.createElement("div"); row.className = "r"; var l = document.createElement("span"); l.textContent = label(r); var t = document.createElement("div"); t.className = "t"; var f = document.createElement("div"); f.className = "f"; f.style.width = (100*(Number(value(r))||0)/mx) + "%"; t.appendChild(f); var v = document.createElement("span"); v.className = "v"; v.textContent = fmt ? fmt(r) : nf.format(Number(value(r))||0); row.appendChild(l); row.appendChild(t); row.appendChild(v); el.appendChild(row); }); } function table(el, head, rows){ el.replaceChildren(); if(!rows.length){ var e = document.createElement("div"); e.className="empty"; e.textContent="Henüz veri yok"; el.appendChild(e); return; } var tb = document.createElement("table"), th = document.createElement("thead"), tr = document.createElement("tr"); head.forEach(function(h){ var c = document.createElement("th"); c.textContent = h; tr.appendChild(c); }); th.appendChild(tr); tb.appendChild(th); var body = document.createElement("tbody"); rows.forEach(function(r){ var x = document.createElement("tr"); r.forEach(function(v){ var c = document.createElement("td"); c.textContent = v; x.appendChild(c); }); body.appendChild(x); }); tb.appendChild(body); el.appendChild(tb); } function dayLabel(d){ var p = d.split("-"); return Number(p[2]) + "." + Number(p[1]); } function hhmm(iso){ var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); } function render(d){ var t = d.totals; put("k-users", nf.format(t.users)); put("k-new", nf.format(t.newUsers7d)); put("k-new-s","önceki 7 gün: " + nf.format(t.newUsersPrev7d)); put("k-q", nf.format(t.queries7d)); put("k-q-s","önceki 7 gün: " + nf.format(t.queriesPrev7d)); put("k-c", usd(t.cost7d,2)); put("k-c-s","toplam: " + usd(t.costTotal,2)); put("k-cpq", usd(t.costPerQuery,3)); put("k-pay", nf.format(t.pendingPayments)); put("k-pay-s","kredisi biten üye: " + nf.format(t.zeroCreditUsers)); var tdy = d.today || []; table($("today"), ["#","Üye","Son saat","Sorgu"], tdy.map(function(r,i){ return [String(i+1), r.name, hhmm(r.last), nf.format(r.queries)]; })); bars($("d-q"), d.daily, function(r){ return dayLabel(r.day); }, function(r){ return r.queries; }); bars($("d-u"), d.daily, function(r){ return dayLabel(r.day); }, function(r){ return r.signups; }); bars($("ver"), d.versions, function(r){ return r.version; }, function(r){ return r.users; }, function(r){ return nf.format(r.users) + " · %" + String(r.pct).replace(".",","); }); table($("kinds"), ["Tür","Sorgu","Maliyet","Sorgu başı"], d.kinds.map(function(r){ return [r.kind, nf.format(r.queries), usd(r.cost,2), usd(r.queries ? r.cost/r.queries : 0, 3)]; })); bars($("cty"), d.countries, function(r){ return r.country; }, function(r){ return r.users; }); put("upd","Güncellendi: " + new Date(d.generatedAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})); put("foot","Maliyet: " + (d.costNote || "tahmin") + ". Gerçek harcama için Anthropic konsoluna, reklam geliri için AdMob'a bakın. Günler UTC'ye göre sayılır."); } function logout(msg){ token = null; store(null); if(timer){ clearInterval(timer); timer = null; } put("err", msg || ""); show("login"); } async function fetchOverview(){ var btn = $("refresh"); btn.disabled = true; btn.textContent = "Yükleniyor…"; try{ var r = await post("/admin?action=overview", { token: token }); if(r.status === 401){ logout("Oturum süresi doldu, tekrar giriş yap."); return; } if(r.status !== 200){ put("upd","Veri alınamadı (" + r.status + ")"); return; } render(r.data); }catch(e){ put("upd","Sunucuya ulaşılamadı. Bağlantını kontrol et."); }finally{ btn.disabled = false; btn.textContent = "Yenile"; } } function start(){ show("app"); fetchOverview(); if(timer) clearInterval(timer); timer = setInterval(function(){ if(!document.hidden) fetchOverview(); }, 60000); } $("f").addEventListener("submit", async function(ev){ ev.preventDefault(); put("err",""); var b = $("go"); b.disabled = true; b.textContent = "Giriş yapılıyor…"; try{ var r = await post("/auth?action=login", { email: $("em").value.trim(), password: $("pw").value }); if(r.status === 200 && r.data.token){ token = r.data.token; store(token); $("pw").value = ""; start(); }else if(r.status === 404 || r.status === 401){ put("err","E-posta veya şifre hatalı."); }else if(r.status === 403){ put("err","Bu hesap yönetici değil."); }else{ put("err","Giriş yapılamadı (" + r.status + ")."); } }catch(e){ put("err","Sunucuya ulaşılamadı. Bağlantını kontrol et."); }finally{ b.disabled = false; b.textContent = "Giriş yap"; } }); $("refresh").addEventListener("click", fetchOverview); $("logout").addEventListener("click", function(){ logout(""); }); token = load(); if(token){ start(); } else { show("login"); } })(); </script> </body> </html> PANEL_SONU find mindgap civciv-ingilizce karpuz-oyunu neyimvar -type f | sort - name: Kaydet run: | git config user.name "site-topla" git config user.email "site-topla@users.noreply.github.com" git add -A if git diff --cached --quiet; then echo "Değişiklik yok" else git commit -m "Üç projenin site dosyalarını topla" git push fi

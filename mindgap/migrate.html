<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MIND GAP — Taşıma</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:#060b12;color:#dff6ff;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
  h1{font-size:1.3rem;color:#00e8ff;text-shadow:0 0 10px rgba(0,220,255,.5);margin:0 0 4px}
  .sub{color:#8fb8d0;font-size:.85rem;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
  .card{background:rgba(0,180,255,.06);border:1px solid rgba(0,220,255,.25);
    border-radius:12px;padding:14px}
  .card .label{font-size:.72rem;color:#8fb8d0;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .card .value{font-size:1.6rem;font-weight:800;color:#ffd040;margin-top:4px}
  section{margin-bottom:26px}
  h2{font-size:1rem;color:#00e8ff;border-bottom:1px solid rgba(0,220,255,.2);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
  th{color:#8fb8d0;font-weight:600}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:.8rem}
  .bar-label{width:90px;flex-shrink:0;color:#8fb8d0}
  .bar-track{flex:1;background:rgba(255,255,255,.05);border-radius:4px;height:16px;position:relative;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#00c8ff,#00ffcc);border-radius:4px}
  .bar-count{width:36px;text-align:right;color:#dff6ff;font-weight:700}
  #status{color:#8fb8d0;font-size:.9rem}
  .note{font-size:.75rem;color:#607080;margin-top:6px;line-height:1.4}
  .err{color:#ff5060;font-weight:600}
  .gate{max-width:360px;margin:12vh auto 0;text-align:center}
  .gate input{width:100%;padding:12px;margin:12px 0;border-radius:10px;border:1px solid rgba(0,220,255,.35);background:#0b1522;color:#dff6ff;font-size:1rem}
  .gate button{width:100%;padding:12px;border-radius:10px;border:0;background:#00c8ff;color:#021018;font-weight:700;font-size:1rem}
  .gate code{display:block;word-break:break-all;background:#0b1522;padding:10px;border-radius:8px;font-size:.75rem;margin-top:10px;color:#ffd040;text-align:left}
</style>
</head>
<body>
  <div class="gate" id="gate" style="display:none">
    <h1>🔒 MIND GAP</h1>
    <div class="sub" id="gateMsg">Devam etmek için şifreyi girin.</div>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Şifre">
    <button id="pwBtn">Giriş</button>
    <div id="gateOut"></div>
  </div>
  <div id="main" style="display:none">

  <h1>🧳 Skor taşıma (bir kerelik)</h1>
  <div class="sub">Eski <b>shared_kv / score:*</b> kayıtlarını yeni <b>scores</b> koleksiyonuna kopyalar. Eski kayıtlara dokunmaz, tekrar çalıştırmak güvenlidir.</div>
  <div class="card" style="margin-bottom:14px"><div class="label">Bu işlem yaklaşık 8.400 okuma + 8.400 yazma yapar.</div></div>
  <button id="go" style="padding:14px;width:100%;border-radius:10px;border:0;background:#ffd040;color:#201800;font-weight:800;font-size:1rem">Taşımayı başlat</button>
  <div id="log" class="note" style="margin-top:14px;font-size:.85rem;white-space:pre-wrap"></div>
  </div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBMcuXyZBDCuZ8ZiqKsheh41LqUyWDU5b8",authDomain:"mindgap-c51b7.firebaseapp.com",projectId:"mindgap-c51b7"});
const db=firebase.firestore();
const logEl=document.getElementById('log');
function log(m){ logEl.textContent+=m+'\n'; }
function toInt(v,d){ const n=Math.floor(Number(v)); return isFinite(n)?n:d; }
async function migrate(){
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='Çalışıyor…';
  try{
    log('Eski kayıtlar okunuyor…');
    const prefix='score:';
    const snap=await db.collection('shared_kv')
      .where(firebase.firestore.FieldPath.documentId(),'>=',prefix)
      .where(firebase.firestore.FieldPath.documentId(),'<',prefix+'\uf8ff').get();
    log('Okunan kayıt: '+snap.size);
    const rows=[]; let bad=0;
    snap.forEach(doc=>{
      try{
        const d=JSON.parse(doc.data().value);
        const name=String(d.name||'').trim();
        if(!name||name.length>40){ bad++; return; }
        const level=Math.max(0,Math.min(1000,toInt(d.level,0)));
        const earned=Math.max(0,Math.min(1000,toInt(typeof d.earnedLevel==='number'?d.earnedLevel:d.level,0)));
        rows.push({id:doc.id.slice(prefix.length),data:{
          name, iq:Math.max(0,Math.min(300,Number(d.iq)||85)),
          score:Math.max(0,Math.min(100000000,toInt(d.score,0))),
          level, earnedLevel:earned, t:Math.max(0,toInt(d.t,0))
        }});
      }catch(e){ bad++; }
    });
    log('Geçerli: '+rows.length+' — atlanan: '+bad);
    let done=0, failed=0;
    for(let i=0;i<rows.length;i+=400){
      const chunk=rows.slice(i,i+400);
      const batch=db.batch();
      chunk.forEach(r=>batch.set(db.collection('scores').doc(r.id),r.data));
      try{ await batch.commit(); done+=chunk.length; }catch(e){ failed+=chunk.length; log('Hata ('+i+'): '+(e.message||e)); }
      log('Yazılan: '+done+' / '+rows.length);
    }
    log('BİTTİ. Yazılan: '+done+', başarısız: '+failed+'.');
    btn.textContent=failed?'Bazıları başarısız, tekrar çalıştır':'Tamamlandı';
    btn.disabled=false;
  }catch(e){ log('HATA: '+(e.message||e)); btn.disabled=false; btn.textContent='Tekrar dene'; }
}
document.getElementById('go').onclick=migrate;
async function run(){}
// ── Şifre kapısı ────────────────────────────────────────────────
// Bu bir caydırıcıdır: sayfayı rastgele açanı engeller. Veri zaten oyunun kendi
// bağlantısıyla okunabilir; asıl koruma Firestore kurallarındadır.
// PASS_HASH boşken sayfa "şifre belirleme" modunda açılır ve üretilen özeti gösterir.
const PASS_HASH = "ab5bfe78444b5db95c176110e9cce453ec8da711cd17e9fb356d64772fae2ed1";
const SALT = "mindgap-stats-v1";
async function hashPw(p){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(SALT), iterations:200000, hash:'SHA-256'}, key, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function startGate(){
  const gate=document.getElementById('gate'), main=document.getElementById('main');
  const pw=document.getElementById('pw'), btn=document.getElementById('pwBtn'), out=document.getElementById('gateOut');
  gate.style.display='block';
  const setup = !PASS_HASH;
  if(setup){
    document.getElementById('gateMsg').textContent='Şifre belirleme modu: yeni şifrenizi yazın, çıkan özeti (hash) dosyadaki PASS_HASH alanına yapıştırın.';
    btn.textContent='Özeti üret';
  }
  async function go(){
    const h = await hashPw(pw.value);
    if(setup){ out.innerHTML='<code></code>'; out.firstChild.textContent=h; return; }
    if(h===PASS_HASH){ gate.style.display='none'; main.style.display='block'; run(); }
    else { out.innerHTML='<div class="err" style="margin-top:10px">Şifre yanlış.</div>'; pw.value=''; }
  }
  btn.onclick=go;
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
startGate();
</script>
</body>
</html>
